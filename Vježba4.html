        <h1 align="center">Jednostavna tablica</h1>

        <table border="1" width="100%" cellpadding="10px">   <!--Bez bordera ne radi, cellpadding daje koliko piksela od rijeci do tablice-->

              <th colspan="5">Dani u tjedenu</th>   <!--Callspand je za spojiti cijelu "crtu"-->

            <tr align="right">
                <td calspand="2">Ponedjeljak</td>
                <!--<td>Utorak</td>                  da se ne spoje pon i utorak -->

                <td>Četvrtak</td>
                <td>Petak</td>
            </tr>
            <tr align="center">
                <td>Ponedjeljak</td>
                
              
                <td>Četvrtak</td>
                <td>Petak</td>
            </tr>

        <h1 align="center">Tablica 2</h1>

        <br>
        <br>

        <table border="1" width="40%" cellpadding="8px" align="center">   <!--Bez bordera ne radi, cellpadding daje koliko piksela od rijeci do tablice-->

            <th colspan="5">naslov tablice</th>   <!--Callspand je za spojiti cijelu "crtu"-->

          
          <tr>
                <td>&nbsp;</td>     <!--none breaking space ako zelim prazan-->
                <td>1. <br>
                    Stupac
                </td>

                    Stupac
                </td>

                </td>

                    Stupac
                </td>
          </tr>
          <tr>
            <td>1.red</td>
            <td bgcolor="orange" rowspan="3">&nbsp;</td>

            <td >&nbsp;</td>
            <td bgcolor="red">&nbsp;</td>


          </tr>
          <tr>
            <td>2.red</td>
            <td bgcolor="yellow" colspan="2">&nbsp;</td>



          </tr>
          <tr>
            <td>3.red</td>

            <td bgcolor="purple" colspan="3">&nbsp;</td>

               
          </tr>
                 
          <caption align="center"> Ovo je opis tablice</caption>
